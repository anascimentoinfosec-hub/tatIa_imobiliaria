name: Backup Completo do Projeto

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup de todos os dados importantes
        run: |
          git config --local user.email "backup@github-actions.com"
          git config --local user.name "Backup Automático"
          
          # Adiciona tudo que é importante
          git add dados/ usuarios.json construtoras.json requirements.txt 2>/dev/null || true
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Backup automático - $(date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "Nada para backup"
          fi