name: Backup Diário dos Dados

on:
  schedule:
    # Roda todos os dias às 3 da manhã
    - cron: '0 3 * * *'
  workflow_dispatch:  # Permite rodar manualmente também

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Fazer backup dos dados
        run: |
          # Cria um arquivo com a data do backup
          echo "Backup realizado em $(date)" > dados/backup_info.txt
          
          # Adiciona os arquivos de dados
          git config --local user.email "backup@github-actions.com"
          git config --local user.name "Backup Automático"
          
          # Só faz commit se houver mudanças
          if [ -n "$(git status --porcelain dados/)" ]; then
            git add dados/
            git commit -m "Backup diário automático - $(date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "Nenhuma alteração detectada. Backup não necessário."
          fi